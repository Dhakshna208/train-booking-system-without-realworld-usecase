services:
  # Full-stack app (Express API + built React frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: train-booking-app
    ports:
      - "5000:5000"
    env_file:
      - .env.docker
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # MongoDB used by the app container
  mongo:
    image: mongo:7
    container_name: train-booking-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
